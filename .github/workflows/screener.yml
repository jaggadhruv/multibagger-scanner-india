name: Weekly Multibagger Screener (India)

on:
  schedule:
    # Every Saturday at 06:00 UTC (after Friday IST close)
    - cron: '0 6 * * 6'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Limit universe size (blank = full run)'
        required: false
        default: ''
      permissive:
        description: 'Permissive mode (include missing data)'
        required: false
        type: boolean
        default: false
      wait_before_technicals:
        description: 'Cooldown seconds before technicals fetch'
        required: false
        default: '60'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run screener
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            ARGS="$ARGS --limit ${{ github.event.inputs.limit }}"
          fi
          if [ "${{ github.event.inputs.permissive }}" = "true" ]; then
            ARGS="$ARGS --permissive"
          fi
          if [ -n "${{ github.event.inputs.wait_before_technicals }}" ]; then
            ARGS="$ARGS --wait-before-technicals ${{ github.event.inputs.wait_before_technicals }}"
          fi
          python main.py $ARGS

      - name: Upload output as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screener-output-${{ github.run_number }}
          path: output/
          retention-days: 30

      - name: Deploy report to GitHub Pages
        if: success()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
          keep_files: false
          commit_message: 'Update India screener report ${{ github.run_number }}'
